name: Run Trading Bot

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this by a few minutes
    # under load — that's the "few min pause" that's expected/fine.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit updated JSON back to the repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot engine
        run: python bot_engine.py

      - name: Commit and push updated signals
        run: |
          git config user.name "trading-bot[actions]"
          git config user.email "actions@users.noreply.github.com"
          git add signals/ config/bot_enabled.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update signals [skip ci]"
          git push
